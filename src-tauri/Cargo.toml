[package]
name = "roofle-app"
version = "1.0.0"
description = "Roofle — meeting copilot"
authors = ["Priyanshu Shekhar"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique and avoids conflicting with the
# bin name on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "roofle_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Persist window size/position/maximized across restarts.
tauri-plugin-window-state = "2"
# Native OS notifications for follow-up questions (background alerts).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timestamps for session rows (real-time persistence wiring).
chrono = "0.4"
roofle-core = { path = "../core" }
live-agent = { path = "../live-agent" }
offline-agent = { path = "../offline-agent" }

# `json` feature powers the AI client's chat-completions requests.
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# Verify server-signed license tokens.
ed25519-dalek = "2"
hex = "0.4"
tar = "0.4"
bzip2 = "0.4"

# Request macOS notification authorization (the notification plugin's desktop
# backend never prompts; without it UNUserNotificationCenter silently drops
# notifications). objc2-user-notifications is already in the dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", features = ["block2"] }
block2 = "0.6"
