# roofle-cli — headless spike binary.
# Proves the audio -> processing -> streaming ASR pipeline in the terminal
# before any Tauri/UI work exists (plan slice S3–S7).

[package]
name = "roofle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless spike binary for the Roofle transcription pipeline"

[dependencies]
roofle-core = { path = "../core" }
# S6: catch Ctrl-C so trailing speech is flushed to a final segment before exit.
ctrlc = "3"
