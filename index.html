<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/roofle-meeting.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Roofle</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="layout">
      <!-- Left sidebar: Roofle brand + previous transcriptions -->
      <aside class="history" aria-label="Roofle">
        <header class="history-header">
          <h1 class="wordmark">
            <svg class="wordmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="13" r="6.4" />
              <circle cx="12" cy="13" r="1.9" />
              <path d="M 9.5 7.3 Q 12 5.4 14.5 7.3" />
              <circle cx="12" cy="4.4" r="1.5" fill="currentColor" stroke="none" />
              <path d="M 3.6 10.2 Q 5.4 8.1 7.7 8.6" />
              <circle cx="4.2" cy="8.6" r="1.5" fill="currentColor" stroke="none" />
              <path d="M 16.3 8.6 Q 18.6 8.1 20.4 10.2" />
              <circle cx="19.8" cy="8.6" r="1.5" fill="currentColor" stroke="none" />
              <path d="M 3.2 15.6 Q 5.2 14 7.6 14.2" />
              <circle cx="3.4" cy="14.2" r="1.5" fill="currentColor" stroke="none" />
              <path d="M 16.4 14.2 Q 18.8 14 20.8 15.6" />
              <circle cx="20.6" cy="14.2" r="1.5" fill="currentColor" stroke="none" />
            </svg>
            <span>Roofle</span>
          </h1>
        </header>
        <div class="history-label">
          <span>Transcriptions</span>
          <span id="history-count" class="history-count">0</span>
        </div>
        <div class="history-list">
          <div id="history-empty" class="history-empty">
            <svg
              class="history-empty-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9A1.5 1.5 0 0 1 18.5 16H8l-4 4z" />
              <path d="M8 9h8M8 12h5" />
            </svg>
            <p>No previous transcriptions yet.</p>
          </div>
        </div>
      </aside>

      <!-- Chat column: new transcription (main) + controls below -->
      <section class="chat">
        <header class="chat-header">
          <h2 class="new-title">New Transcription</h2>
          <div class="status" role="status" aria-live="polite" aria-atomic="true">
            <span id="status-dot" class="status-dot idle" aria-hidden="true"></span>
            <span id="status-text">Idle</span>
          </div>
        </header>

        <!-- Transcription as chat messages -->
        <div
          id="transcript"
          class="chat-messages"
          tabindex="0"
          aria-label="Transcribed text"
        >
          <div id="empty-state" class="empty-state">
            <p id="empty-hint" class="empty-hint">
              Start recording to transcribe your meeting.
            </p>
          </div>
        </div>

        <!-- Live in-progress text -->
        <p id="partial" class="partial" aria-live="polite"></p>

        <!-- Model download progress -->
        <div
          id="model-progress"
          class="model-progress"
          role="status"
          aria-live="polite"
          hidden
        >
          <div class="model-progress-track" aria-hidden="true">
            <div id="model-progress-fill" class="model-progress-fill"></div>
          </div>
          <span id="model-progress-text"></span>
        </div>

        <!-- Composer bar: main controls + small actions -->
        <footer class="composer">
          <div class="composer-transport">
            <button id="record-btn" type="button" class="record-btn" aria-label="Start recording">
              <span class="record-btn-inner">
                <svg
                  id="record-icon-play"
                  class="record-icon"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  stroke="none"
                  aria-hidden="true"
                >
                  <path d="M8 5.14v13.72c0 .9.98 1.45 1.75.98l10.2-6.86a1.15 1.15 0 0 0 0-1.96L9.75 4.16A1.15 1.15 0 0 0 8 5.14z" />
                </svg>
                <svg
                  id="record-icon-pause"
                  class="record-icon"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  stroke="none"
                  aria-hidden="true"
                  hidden
                >
                  <rect x="6" y="5" width="4" height="14" rx="1" />
                  <rect x="14" y="5" width="4" height="14" rx="1" />
                </svg>
              </span>
            </button>

            <button id="stop-btn" type="button" class="stop-btn" aria-label="Stop recording" hidden>
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2" />
              </svg>
            </button>

            <span id="timer" class="timer" aria-hidden="true">00:00</span>

            <div class="level-meter" aria-label="Audio level" title="Audio level">
              <div id="level-fill" class="level-fill"></div>
            </div>
          </div>

          <div class="composer-actions">
            <div class="select-wrap">
              <select id="model-select" aria-label="Model"></select>
            </div>
            <button id="export-txt" type="button" disabled>Export .txt</button>
            <button id="export-srt" type="button" disabled>Export .srt</button>
            <span id="export-path" class="export-path" role="status" aria-live="polite"></span>
          </div>
        </footer>
      </section>

      <!-- Reserved right panel (25% width), for future use -->
      <aside class="sidebar" aria-hidden="true">
        <span class="sidebar-hint">Reserved</span>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
