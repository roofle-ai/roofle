[package]
name = "roofle-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pure-Rust audio capture, processing and streaming ASR pipeline for Roofle"

[lib]
name = "roofle_core"
path = "src/lib.rs"

[dependencies]
cpal = "0.15"
rubato = "0.15"
sherpa-onnx = "1.13"
serde = { version = "1", features = ["derive"] }
# Session/transcript persistence. `bundled` compiles SQLite from source so no
# system sqlite is required. chrono "serde" lets DateTime<Utc> cross IPC.
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1"
