name: Release

# Manual only: Actions tab → Release → Run workflow. Builds, signs and notarizes the DMG and uploads it as
# an artifact. Tick "Create draft release" to also attach it to a draft GitHub Release named v<version>.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create draft release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # Apple Silicon
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Baked into the app at build time (see src-tauri/build.rs).
      ROOFLE_LICENSE_GATE: "on"
      ROOFLE_POLAR_ORG_ID: ${{ secrets.ROOFLE_POLAR_ORG_ID }}
      VITE_FEEDBACK_URL: ${{ secrets.VITE_FEEDBACK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID ROOFLE_POLAR_ORG_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v"; exit 1; }
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - run: npm ci

      # Models are downloaded by the app on first launch, so there is nothing to fetch here.
      # Tauri imports APPLE_CERTIFICATE into a temporary keychain, signs, then notarizes and staples.
      - name: Build, sign and notarize
        run: npm run tauri build -- --bundles dmg

      - name: Verify signature and notarization
        run: |
          app=target/release/bundle/macos/Roofle.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: Roofle-dmg
          path: target/release/bundle/dmg/*.dmg

      - name: Create draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)"
          gh release create "$tag" target/release/bundle/dmg/*.dmg \
            --draft --target "$GITHUB_SHA" --title "$tag" \
            --notes "Open the DMG, drag Roofle to Applications, then enter your beta license key on first launch."
