name: Release

# Manual only: Actions tab → Release → Run workflow. Builds, signs and notarizes the app, then creates a DRAFT
# GitHub Release v<version> (from src-tauri/tauri.conf.json) holding the DMG, the updater bundle + signature,
# latest.json (what the in-app updater reads) and SHA256SUMS. Check the draft, then publish it by hand.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 90 # first notarization can queue for a long time; don't burn minutes forever
    # Secrets live in the "release" environment; add required reviewers there so only approved runs get them.
    environment: release
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Signs the updater bundle; the matching public key is in tauri.conf.json (plugins.updater.pubkey).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Baked into the frontend at build time.
      VITE_FEEDBACK_URL: ${{ secrets.VITE_FEEDBACK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - run: npm ci

      # Models are downloaded by the app on first launch, so there is nothing to fetch here.
      # tauri-action builds, signs (Apple + updater key), notarizes, and uploads everything to a draft release,
      # including latest.json. tagName/releaseName use the version from tauri.conf.json.
      - name: Build, sign, notarize and draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: Open the DMG and drag Roofle to Applications. Verify the download against SHA256SUMS.
          releaseDraft: true
          prerelease: false # the updater's /releases/latest skips pre-releases
          uploadUpdaterJson: true
          args: --bundles app,dmg

      - name: Verify signature and notarization
        run: |
          app=target/release/bundle/macos/Roofle.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          cd target/release/bundle
          shasum -a 256 dmg/*.dmg macos/*.app.tar.gz | sed 's# [a-z]*/# #' > SHA256SUMS
          cat SHA256SUMS
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
            --data-binary @SHA256SUMS \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS"
