name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: npm ci

      # Models are gitignored but bundled into the app.
      - run: scripts/fetch-assets.sh

      # Ad-hoc signature ("-"): no Apple Developer ID, but the app is still
      # signed, which Apple Silicon requires. Recipients bypass Gatekeeper
      # once (see release notes below).
      - name: Build DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Roofle-dmg
          path: target/release/bundle/dmg/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **First launch on a Mac (build is not Apple-notarized):**
          1. Open the DMG, drag Roofle to Applications.
          2. Run once in Terminal: `xattr -cr /Applications/Roofle.app`
             (or right-click Roofle → Open → Open; on macOS 15+: System Settings → Privacy & Security → "Open Anyway").
          3. Grant Microphone and Screen & System Audio Recording when prompted.
          NOTES
          gh release create "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
