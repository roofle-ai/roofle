<div id="settings-modal" class="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="settings-dialog">
    <div class="settings-head">
      <h2 id="settings-title" class="settings-title">Settings</h2>
      <button id="settings-close" type="button" class="settings-close" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <section class="settings-section">
      <h3 class="settings-section-title">Live Session Settings</h3>

      <div class="settings-field">
        <span class="settings-field-label">Triggers</span>
        <label for="char-limit" class="settings-field-desc">
          Generate questions after this many new characters
        </label>
        <input id="char-limit" type="number" min="50" max="5000" step="10" value="200" class="settings-input" />
        <p class="settings-field-hint">Default 200. Lower values surface questions sooner.</p>
      </div>
    </section>

    <div class="settings-actions">
      <button id="settings-cancel" type="button" class="btn-ghost">Cancel</button>
      <button id="settings-save" type="button" class="btn-primary">Save</button>
    </div>
  </div>
</div>
