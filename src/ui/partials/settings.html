<div id="settings-modal" class="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="settings-dialog">
    <div class="settings-head">
      <h2 id="settings-title" class="settings-title">Settings</h2>
      <button id="settings-close" type="button" class="settings-close" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <section class="settings-section">
      <h3 class="settings-section-title">Live Session Settings</h3>

      <div class="settings-field">
        <span class="settings-field-label">Triggers</span>
        <label for="char-limit" class="settings-field-desc">
          Generate questions after this many new characters
        </label>
        <input id="char-limit" type="number" min="50" max="5000" step="10" value="200" class="settings-input" />
        <p class="settings-field-hint">Default 200. Lower values surface questions sooner.</p>
      </div>
    </section>

    <section class="settings-section">
      <h3 class="settings-section-title">AI (OpenAI-compatible)</h3>

      <div class="settings-field">
        <span class="settings-field-label">Base URL</span>
        <label for="ai-base-url" class="settings-field-desc">
          Any OpenAI-compatible endpoint (OpenAI, OpenRouter, Groq, Ollama…)
        </label>
        <input id="ai-base-url" type="text" class="settings-input" placeholder="https://api.openai.com/v1" />
      </div>

      <div class="settings-field">
        <span class="settings-field-label">Model</span>
        <label for="ai-model" class="settings-field-desc">e.g. gpt-4o, llama3.1</label>
        <input id="ai-model" type="text" class="settings-input" placeholder="gpt-4o" />
      </div>

      <div class="settings-field">
        <span class="settings-field-label">API key</span>
        <label for="ai-api-key" class="settings-field-desc">
          Stored in the OS keychain, never on disk
        </label>
        <input id="ai-api-key" type="password" class="settings-input" placeholder="sk-…" autocomplete="off" />
        <p id="ai-key-state" class="settings-field-hint"></p>
      </div>

      <div class="ai-settings-actions">
        <span id="ai-test-result" class="ai-test-result" role="status" aria-live="polite"></span>
        <button id="ai-test" type="button" class="btn-ghost">Test connection</button>
      </div>
    </section>

    <div class="settings-actions">
      <button id="settings-cancel" type="button" class="btn-ghost">Cancel</button>
      <button id="settings-save" type="button" class="btn-primary">Save</button>
    </div>
  </div>
</div>
