<section class="panel transcript" id="transcript-panel">
  <div class="transcript-head">
    <h2 id="chat-title" class="new-title">Notes</h2>
    <!-- Assist actions: a trigger that opens a small popover of AI helpers. -->
    <div id="assist-control" class="assist-control" hidden>
      <button id="assist-btn" type="button" class="assist-btn" aria-haspopup="menu" aria-expanded="false">
        <i data-lucide="wand-sparkles" aria-hidden="true"></i>
        <span>Assist</span>
        <svg class="assist-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <div id="assist-menu" class="assist-menu" role="menu" aria-label="Assist options" hidden>
        <button type="button" role="menuitem" data-assist="last-30s">
          <i data-lucide="rewind" aria-hidden="true"></i>
          <span class="assist-item-text">
            <span class="assist-item-label">Last 30s</span>
            <span class="assist-item-desc">What did they say in the last 30s?</span>
          </span>
        </button>
        <button type="button" role="menuitem" data-assist="numbers">
          <i data-lucide="hash" aria-hidden="true"></i>
          <span class="assist-item-text">
            <span class="assist-item-label">What numbers did they mention?</span>
            <span class="assist-item-desc">Figures, dates and names they've said so far.</span>
          </span>
        </button>
        <button type="button" role="menuitem" data-assist="review">
          <i data-lucide="clipboard-check" aria-hidden="true"></i>
          <span class="assist-item-text">
            <span class="assist-item-label">Review</span>
            <span class="assist-item-desc">Review your conversation to know the good and bad.</span>
          </span>
        </button>
        <div class="assist-sep" role="separator"></div>
        <button type="button" role="menuitem" data-export="transcript">
          <i data-lucide="download" aria-hidden="true"></i>
          <span class="assist-item-text">
            <span class="assist-item-label">Export transcription</span>
            <span class="assist-item-desc">Save the full transcript as a .txt file.</span>
          </span>
        </button>
        <button type="button" role="menuitem" data-export="notes">
          <i data-lucide="download" aria-hidden="true"></i>
          <span class="assist-item-text">
            <span class="assist-item-label">Export notes</span>
            <span class="assist-item-desc">Save your meeting notes as a .txt file.</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Editable notes page: live transcription auto-appends here; the user can
       edit/overwrite freely. The textarea holds the final notes (seed +
       user edits) and is what gets persisted per session. -->
  <div id="notes-page" class="notes-page">
    <textarea
      id="notes-input"
      class="notes-input"
      spellcheck="true"
      aria-label="Conversation notes"
      placeholder="Start recording or type your notes here…"
    ></textarea>
  </div>

  <!-- Model download progress -->
  <div id="model-progress" class="model-progress" role="status" aria-live="polite" hidden>
    <div class="model-progress-track" aria-hidden="true">
      <div id="model-progress-fill" class="model-progress-fill"></div>
    </div>
    <span id="model-progress-text"></span>
  </div>

  <!-- Floating transport control: hidden until a recording starts, then
       centered over the notes and draggable -->
  <div id="floating-control" class="floating-control is-idle">
    <button id="record-btn" type="button" class="record-btn" aria-label="Start recording">
      <span class="record-btn-inner">
        <svg id="record-icon-play" class="record-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
          <path d="M8 5.14v13.72c0 .9.98 1.45 1.75.98l10.2-6.86a1.15 1.15 0 0 0 0-1.96L9.75 4.16A1.15 1.15 0 0 0 8 5.14z" />
        </svg>
        <svg id="record-icon-pause" class="record-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true" hidden>
          <rect x="6" y="5" width="4" height="14" rx="1" />
          <rect x="14" y="5" width="4" height="14" rx="1" />
        </svg>
      </span>
    </button>
    <button id="stop-btn" type="button" class="stop-btn" aria-label="Stop recording" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2" />
      </svg>
    </button>
    <span id="timer" class="timer" aria-hidden="true">00:00</span>
  </div>

  <!-- Offline self-assessment dashboard (offline-agent): overlays the notes
       once an analysis has run. -->
  <div id="analysis-dashboard" class="analysis-dashboard" hidden>
    <div class="analysis-dash-head">
      <h3 class="analysis-dash-title">Conversation review</h3>
      <button id="analysis-close" type="button" class="analysis-close" aria-label="Close analysis">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div id="analysis-body" class="analysis-body"></div>
  </div>
</section>

<div class="resizer" data-resizer="questions" role="separator" aria-orientation="vertical" aria-label="Resize questions panel" tabindex="0"></div>

<!-- Analyse modal: pick a perspective + context, then run the offline-agent. -->
<div id="analyse-modal" class="analyse-overlay" role="dialog" aria-modal="true" aria-labelledby="analyse-title" hidden>
  <div class="analyse-dialog">
    <div class="analyse-head">
      <h2 id="analyse-title" class="analyse-title">Review this conversation</h2>
      <button id="analyse-close" type="button" class="analyse-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="analyse-field">
      <label class="analyse-label" for="analyse-perspective">Review as</label>
      <span class="analyse-desc">How you'd like to evaluate this conversation.</span>
      <select id="analyse-perspective" class="analyse-select"></select>
    </div>

    <div class="analyse-field">
      <label class="analyse-label" for="analyse-context">Conversation type</label>
      <span class="analyse-desc">What kind of conversation this is.</span>
      <select id="analyse-context" class="analyse-select"></select>
    </div>

    <div class="analyse-actions">
      <button id="analyse-cancel" type="button" class="btn-ghost">Cancel</button>
      <button id="analyse-submit" type="button" class="btn-primary">Start review</button>
    </div>
  </div>
</div>
