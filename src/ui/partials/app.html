<main class="app">
  <!-- First run: the speech model is downloaded on demand, not bundled -->
  <div id="model-setup" class="model-banner" role="status" aria-live="polite" hidden>
    <i data-lucide="download" aria-hidden="true"></i>
    <span id="model-setup-text" class="model-banner-text">Roofle needs a one-time speech model download before it can transcribe.</span>
    <div id="model-progress" class="model-progress" hidden>
      <div class="model-progress-track" aria-hidden="true">
        <div id="model-progress-fill" class="model-progress-fill"></div>
      </div>
      <span id="model-progress-text" class="model-progress-text"></span>
    </div>
    <button id="model-download-btn" type="button" class="model-banner-btn">Download model</button>
  </div>
  <!--@header-->
  <div class="workspace">
    <!--@workspace-->
  </div>
</main>
