<header class="cmdbar">
  <nav class="crumb" aria-label="Main menu">
    <button id="crumb-btn" type="button" class="crumb-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="history-menu" aria-label="Conversations and settings" title="Conversations and settings">
      <i data-lucide="menu" aria-hidden="true"></i>
    </button>
    <h1 class="wordmark-name">Roofle</h1>
    <!--@history-menu-->
  </nav>
  <div class="cmdbar-actions">
    <button id="feedback-btn" type="button" class="icon-btn icon-btn-label" aria-label="Submit feedback">
      <i data-lucide="message-square-heart" aria-hidden="true"></i><span>Submit feedback</span>
    </button>
    <span id="session-pill" class="session-pill" role="status" aria-live="polite" aria-atomic="true">
      <span id="status-dot" class="status-dot idle" aria-hidden="true"></span>
      <span id="status-text">Idle</span>
      <button id="status-dismiss" type="button" class="status-dismiss" aria-label="Dismiss message" title="Dismiss" hidden>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </span>
  </div>
</header>
