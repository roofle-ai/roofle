<header class="cmdbar">
  <div class="cmdbar-brand">
    <h1 class="wordmark">
      <span class="brand-lockup">
        <span class="brand-chip" aria-hidden="true">
          <!--@roofle-icon-->
        </span>
        <span class="brand-text">
          <span class="wordmark-name">Roofle</span>
          <span class="wordmark-tag">Listen. Note. Coach.</span>

    </span>
  </div>
