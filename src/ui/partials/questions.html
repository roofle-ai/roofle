<aside class="panel questions" id="questions-panel">
  <div class="panel-head">
    <div class="panel-title">
      <h2 class="panel-h2">Follow-up questions</h2>
      <span id="q-live" class="live-badge" role="status" aria-live="polite" aria-atomic="true"></span>
    </div>
  </div>

  <!-- Post-meeting analysis summary — one compact row, questions lead -->
  <div id="summary-card" class="summary-card" hidden>
    <div class="summary-head">
      <span class="summary-title">
        <span>Insights</span>
      </span>
      <div id="summary-stats" class="summary-stats" aria-live="polite"></div>
    </div>
  </div>

  <div id="questions-empty" class="questions-empty">
    <span class="empty-orb insight" aria-hidden="true">
      <i data-lucide="message-square-quote"></i>
    </span>
    <strong class="empty-title">Stay sharp in the moment</strong>
    <p id="questions-empty-hint">Roofle listens for what's left unsaid — follow-up questions will surface here as the conversation unfolds.</p>
  </div>

  <div id="questions-list" class="questions-list"></div>
</aside>
