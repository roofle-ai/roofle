<aside class="panel history" id="history-panel">
  <div class="panel-head">
    <div class="panel-title">
      <h2 class="panel-h2">Conversations</h2>
      <p class="panel-sub">Your recorded reviews.</p>
    </div>
    <button id="toggle-history" type="button" class="icon-btn" aria-label="Collapse conversations panel" aria-pressed="true" aria-controls="history-panel" title="Toggle conversations panel">
      <i data-lucide="panel-left" aria-hidden="true"></i>
    </button>
  </div>

  <button id="new-session-btn" type="button" class="new-chat">
    <i data-lucide="plus" aria-hidden="true"></i>
    <span>New conversation</span>
  </button>

  <!-- Collapsed rail: one icon (click to expand) with the number of saved conversations. -->
  <button id="history-rail" type="button" class="history-rail" aria-label="Show conversations" title="Conversations">
    <i data-lucide="history" aria-hidden="true"></i>
    <span id="history-rail-badge" class="rail-badge" hidden></span>
  </button>

  <div class="history-label">
    <span>Recent</span>
    <span id="history-count" class="history-count">0</span>
  </div>

  <div class="history-list">
    <div id="history-empty" class="history-empty">
      <span class="empty-orb" aria-hidden="true">
        <svg class="history-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9A1.5 1.5 0 0 1 18.5 16H8l-4 4z" />
          <path d="M8 9h8M8 12h5" />
        </svg>
      </span>
      <strong class="empty-title">No conversations yet</strong>
      <p class="empty-copy">Start a new conversation and it will appear here.</p>
    </div>
  </div>
  <div class="history-footer">
    <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle theme" title="Toggle light / dark theme">
      <i data-lucide="moon" aria-hidden="true"></i>
    </button>
    <button id="settings-btn" type="button" class="icon-btn" aria-label="Settings">
      <i data-lucide="settings" aria-hidden="true"></i>
    </button>
  </div>
</aside>

<div class="resizer" data-resizer="history" role="separator" aria-orientation="vertical" aria-label="Resize history panel" tabindex="0"></div>
