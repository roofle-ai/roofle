<!-- Conversations + settings: the dropdown behind the header breadcrumb (see app/history-menu.ts). -->
<div class="history-menu" id="history-menu" role="dialog" aria-label="Conversations" hidden>
  <div class="history-search">
    <i data-lucide="search" aria-hidden="true"></i>
    <input id="history-search" type="text" class="history-search-input" placeholder="Search" aria-label="Search conversations and topics" autocomplete="off" spellcheck="false" />
    <button id="history-search-clear" type="button" class="history-search-clear" aria-label="Clear search" hidden>
      <i data-lucide="x" aria-hidden="true"></i>
    </button>
  </div>

  <div class="history-list">
    <p id="history-no-results" class="history-no-results" hidden>Nothing matches your search.</p>
    <div id="history-empty" class="history-empty">
      <span class="empty-orb" aria-hidden="true">
        <svg class="history-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9A1.5 1.5 0 0 1 18.5 16H8l-4 4z" />
          <path d="M8 9h8M8 12h5" />
        </svg>
      </span>
      <strong class="empty-title">No conversations yet</strong>
      <p class="empty-copy">Start a new conversation and it will appear here.</p>
    </div>
  </div>

  <div class="history-footer">
    <button id="settings-btn" type="button" class="icon-btn icon-btn-label" aria-label="Settings">
      <i data-lucide="settings" aria-hidden="true"></i><span>Settings</span>
    </button>
  </div>
</div>
