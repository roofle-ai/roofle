<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <title>Meeting around a round table</title>
  <!-- Round conference table -->
  <circle cx="12" cy="13" r="6.4"/>
  <circle cx="12" cy="13" r="1.9"/>

  <!-- People seated around the table (heads + shoulders) -->
  <g>
    <!-- top -->
    <path d="M 9.5 7.3 Q 12 5.4 14.5 7.3" fill="none"/>
    <circle cx="12" cy="4.4" r="1.5" fill="currentColor" stroke="none"/>
  </g>
  <g>
    <!-- upper-left -->
    <path d="M 3.6 10.2 Q 5.4 8.1 7.7 8.6" fill="none"/>
    <circle cx="4.2" cy="8.6" r="1.5" fill="currentColor" stroke="none"/>
  </g>
  <g>
    <!-- upper-right -->
    <path d="M 16.3 8.6 Q 18.6 8.1 20.4 10.2" fill="none"/>
    <circle cx="19.8" cy="8.6" r="1.5" fill="currentColor" stroke="none"/>
  </g>
  <g>
    <!-- lower-left -->
    <path d="M 3.2 15.6 Q 5.2 14 7.6 14.2" fill="none"/>
    <circle cx="3.4" cy="14.2" r="1.5" fill="currentColor" stroke="none"/>
  </g>
  <g>
    <!-- lower-right -->
    <path d="M 16.4 14.2 Q 18.8 14 20.8 15.6" fill="none"/>
    <circle cx="20.6" cy="14.2" r="1.5" fill="currentColor" stroke="none"/>
  </g>
</svg>
