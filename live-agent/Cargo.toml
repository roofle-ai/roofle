[package]
name = "live-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Live meeting analysis: paragraph watcher, notes agent and the follow-up question pipeline"

[dependencies]
roofle-core = { path = "../core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
